name: Build Parksy Axis

on:
  push:
    branches: [main]
    paths:
      - 'apps/parksy-axis/**'
      - '.github/workflows/build-parksy-axis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parksy-axis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      # ── debug 키스토어 고정 ─────────────────────────────────────────────
      # 러너는 매번 새 컨테이너라 ~/.android/debug.keystore 가 없으면 Gradle 이
      # **새 키를 즉석 생성**한다. 그러면 실행마다 서명이 달라져, 폰에 덮어 설치할 때
      # SIGNATURE_MISMATCH 로 막히고 → 지웠다 깔아야 하고 → 앱 데이터(주입한 콘티·
      # 누적 라이브러리)가 사라진다. 키를 캐시해서 서명을 한 번 고정한다.
      # (debug 키는 비밀이 아니다 — 비밀번호가 공개된 안드로이드 표준 키다)
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: parksy-axis-debug-keystore-v2

      - name: Print signing fingerprint
        run: |
          KS="$HOME/.android/debug.keystore"
          # keytool 은 상위 디렉터리를 만들지 않는다. 러너 이미지에는 ~/.android 가
          # 아예 없어서, 이 mkdir 없이 첫 빌드가 keytool 에서 죽었다(2026-09-22).
          mkdir -p "$HOME/.android"
          [ -f "$KS" ] || keytool -genkeypair -v -keystore "$KS" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
            | grep -E 'SHA256|SHA-1' | head -2

      - name: Build Debug APK
        # AXIS_KEYSTORE 로 경로를 못 박는다. 안 박으면 Gradle 이 기본 경로에서
        # 다른 키를 만들어 서명이 흔들린다(2026-09-22 실측: 키스토어 06:22:04 생성
        # vs APK 인증서 06:25:20 생성 = 다른 키).
        env:
          AXIS_KEYSTORE: /home/runner/.android/debug.keystore
        run: flutter build apk --debug

      # ── 서명 게이트 ─────────────────────────────────────────────────────
      # 서명이 어긋난 APK 는 폰에 **덮어 설치가 안 된다.** 그러면 지웠다 깔아야
      # 하고 앱 데이터가 날아간다. 그런 APK 를 조용히 배포하느니 여기서 죽는다.
      - name: Verify APK signing cert matches the keystore
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          APK=build/app/outputs/flutter-apk/app-debug.apk
          norm() { tr -d ': \n' | tr 'A-Z' 'a-z'; }
          WANT=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
                 | grep -m1 'SHA256:' | sed 's/.*SHA256://' | norm)
          # apksigner 가 정본(v1/v2/v3 전부 본다). 없으면 keytool 로 폴백(v1 만).
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${APKSIGNER:-}" ] && [ -x "$APKSIGNER" ]; then
            GOT=$("$APKSIGNER" verify --print-certs "$APK" \
                  | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//' | norm)
          else
            echo "apksigner 를 못 찾음 — keytool 로 폴백"
            GOT=$(keytool -printcert -jarfile "$APK" \
                  | grep -m1 'SHA256:' | sed 's/.*SHA256://' | norm)
          fi
          echo "keystore : $WANT"
          echo "apk      : $GOT"
          [ "$WANT" = "$GOT" ] || {
            echo "::error::APK 서명이 키스토어와 다릅니다 — 이 APK 는 덮어 설치가 안 됩니다"; exit 1; }
          echo "서명 일치 ✅ 덮어 설치 가능"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parksy-axis-debug
          path: apps/parksy-axis/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: parksy-axis-latest
          name: Parksy Axis (Latest)
          body: |
            🎯 Parksy Axis v${{ steps.version.outputs.version }}

            Auto-updated on each successful build.
          files: apps/parksy-axis/build/app/outputs/flutter-apk/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
